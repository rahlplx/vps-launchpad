# docker-compose.monitoring.yml
# HITL: 🔴 BLOCK — Human deploys via Coolify or CLI
# Resource caps enforced per governance R08

services:
  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    restart: unless-stopped
    pid: host
    network_mode: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /:/host/root:ro,rslave
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - NETDATA_CLAIM_TOKEN=${NETDATA_CLAIM_TOKEN:-}   # Optional cloud connect
      - NETDATA_CLAIM_URL=https://app.netdata.cloud
    deploy:
      resources:
        limits:
          memory: 256M      # governance R08 — hard cap
          cpus: '0.5'
    # Access: http://localhost:19999 — NOT exposed publicly
    # Route through Traefik with auth if remote access needed

volumes:
  netdataconfig:
  netdatalib:
  netdatacache:

name: HITL Gate Check

on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize]

jobs:
  hitl-label-required:
    name: Require HITL label
    runs-on: ubuntu-latest
    steps:
      - name: Check for HITL label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const hitlLabels = labels.filter(l => l.startsWith('hitl:'));
            if (hitlLabels.length === 0) {
              core.setFailed(
                'PR must have exactly one hitl: label.\n' +
                'Valid labels: hitl:auto | hitl:review | hitl:block | hitl:needs-classification\n' +
                'See agents/hitl/gates.md for guidance.'
              );
            } else if (hitlLabels.length > 1) {
              core.setFailed(
                `PR has multiple hitl: labels: ${hitlLabels.join(', ')}.\n` +
                'Choose exactly one.'
              );
            } else {
              console.log(`✅ HITL gate declared: ${hitlLabels[0]}`);
            }

  secrets-scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Run Gitleaks
        run: gitleaks detect --source . --redact --exit-code 1

  agents-md-check:
    name: AGENTS.md present in new folders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check new directories have AGENTS.md
        run: |
          # Get directories from changed files, then filter to only truly NEW ones
          CHANGED_DIRS=$(git diff --name-only origin/main...HEAD | grep '/' | xargs -I{} dirname {} | sort -u)
          MISSING=()
          for dir in $CHANGED_DIRS; do
            # Skip directories that already existed in origin/main
            if git rev-parse --verify "origin/main:$dir" > /dev/null 2>&1; then
              continue
            fi
            # This is a genuinely new directory — require AGENTS.md
            if [ -d "$dir" ] && [ ! -f "$dir/AGENTS.md" ]; then
              MISSING+=("$dir")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ Missing AGENTS.md in new directories: ${MISSING[*]}"
            exit 1
          else
            echo "✅ All new directories have AGENTS.md"
          fi

# docker-compose.observability.yml — Lightweight observability stack
# HITL: 🔴 BLOCK — Human deploys on VPS
# Resource caps enforced per governance R08
#
# Stack: Netdata (system metrics) + MLflow (LLM/agent traces, SQLite backend)
# Total RAM budget: ~384MB (vs Langfuse's 2GB+)

services:
  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    restart: unless-stopped
    pid: host
    network_mode: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /:/host/root:ro,rslave
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow
    restart: unless-stopped
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow_data:/mlflow
    networks:
      - vps-internal
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

networks:
  vps-internal:
    driver: bridge

volumes:
  netdataconfig:
  netdatalib:
  netdatacache:
  mlflow_data:
